<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prompte Channel</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #111827;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 32px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.6;
        }

        .card {
            margin-top: 25px;
            padding: 25px;
            border-radius: 16px;
            background: #1f2937;
        }

        .status {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 20px;
            background: #064e3b;
            color: #6ee7b7;
            font-size: 14px;
            margin-bottom: 15px;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            padding: 13px 22px;
            border-radius: 10px;
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔥 Prompte Channel</h1>

    <p>
        AI prompts, creative ideas and useful resources.
    </p>

    <div class="card">

        <div class="status">
            ● Service Online
        </div>

        <p>
            The Prompte Channel service is running successfully.
        </p>

        <a href="/health">
            Check Service Health
        </a>

    </div>

</div>

</body>
</html>
