<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ prompt.title }}</title>
    
    <!-- Dynamic Adsterra Popunder Ads Code -->
    {% if popunder_script %}
    {{ popunder_script | safe }}
    {% endif %}

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 {
            font-size: 1.5rem;
            margin-bottom: 16px;
            color: #38bdf8;
        }
        .media-box {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            background: #0f172a;
        }
        .media-box img, .media-box video {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
        }
        .btn-download {
            display: inline-block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2563eb, #0284c7);
            color: #ffffff;
            font-weight: bold;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, background 0.3s;
        }
        .btn-download:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #1d4ed8, #0369a1);
        }
        .info-text {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>{{ prompt.title }}</h2>

    <div class="media-box">
        {% if prompt.media_type == 'video' %}
            <video controls autoplay loop muted src="{{ prompt.media_url }}"></video>
        {% else %}
            <img src="{{ prompt.media_url }}" alt="AI Prompt Preview">
        {% endif %}
    </div>

    <!-- Monetization Button -->
    <button id="downloadBtn" class="btn-download">📥 Download Full Prompt</button>
    <p class="info-text">Click button to unlock full prompt in Telegram Bot.</p>
</div>

<script>
    let clickCount = 0;
    const smartlinkUrl = "{{ smartlink }}";
    const tgBotUrl = "{{ tg_bot_url }}";

    document.getElementById('downloadBtn').addEventListener('click', function() {
        clickCount++;

        if (clickCount === 1) {
            // 1st Click: Opens Adsterra Direct Smartlink in a new tab
            window.open(smartlinkUrl, '_blank');
            this.innerText = "➡️ Click Again to Get Prompt in Bot";
            this.style.background = "linear-gradient(135deg, #16a34a, #15803d)";
        } else {
            // 2nd Click: Redirects user to Telegram Bot with Prompt ID
            window.location.href = tgBotUrl;
        }
    });
</script>

</body>
</html>
